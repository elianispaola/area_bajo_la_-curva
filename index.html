<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Sumas de Riemann</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .controls { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; }
    .canvas-container { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; font-weight: bold; }
    textarea { width: 100%; height: 100px; }
    select, input[type="range"] { width: 100%; }
    .result { margin-top: 15px; padding: 10px; background: #eef; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Simulación de Área bajo la Curva (Sumas de Riemann)</h2>

<div class="container">
  <div class="controls">
    <label for="dataInput">Puntos (Tiempo, Valor):</label>
    <textarea id="dataInput">0, 2
2, 5
4, 3
6, 8
8, 6
10, 9</textarea>

    <label for="methodSelect">Método de evaluación:</label>
    <select id="methodSelect">
      <option value="left">Por la Izquierda</option>
      <option value="right">Por la Derecha</option>
      <option value="midpoint">Punto Medio (Centro)</option>
    </select>

    <label for="rectSlider">Número de Rectángulos (N): <span id="rectVal">6</span></label>
    <input type="range" id="rectSlider" min="1" max="50" value="6">

    <div class="result" id="resultArea">Área estimada: 0</div>
  </div>

  <div class="canvas-container">
    <canvas id="plotCanvas" width="600" height="400"></canvas>
  </div>
</div>

<script>
// Referencias del DOM
const dataInput = document.getElementById('dataInput');
const methodSelect = document.getElementById('methodSelect');
const rectSlider = document.getElementById('rectSlider');
const rectVal = document.getElementById('rectVal');
const resultArea = document.getElementById('resultArea');
const canvas = document.getElementById('plotCanvas');
const ctx = canvas.getContext('2d');

// Parámetros de la vista del Canvas
const padding = 40;

// Parsea y ordena el texto introducido
function parsePoints() {
  const lines = dataInput.value.trim().split('\n');
  const points = [];
  for (let line of lines) {
    const parts = line.split(',');
    if (parts.length === 2) {
      const x = parseFloat(parts[0].trim());
      const y = parseFloat(parts[1].trim());
      if (!isNaN(x) && !isNaN(y)) {
        points.push({ x, y });
      }
    }
  }
  return points.sort((a, b) => a.x - b.x);
}

// Interpolación lineal entre los datos experimentales
function interpolate(x, points) {
  if (points.length === 0) return 0;
  if (x <= points[0].x) return points[0].y;
  if (x >= points[points.length - 1].x) return points[points.length - 1].y;

  for (let i = 0; i < points.length - 1; i++) {
    if (x >= points[i].x && x <= points[i + 1].x) {
      const t = (x - points[i].x) / (points[i + 1].x - points[i].x);
      return points[i].y + t * (points[i + 1].y - points[i].y);
    }
  }
  return 0;
}

// Dibujar y calcular
function draw() {
  const points = parsePoints();
  const N = parseInt(rectSlider.value);
  const method = methodSelect.value;
  rectVal.textContent = N;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (points.length < 2) {
    resultArea.textContent = 'Ingresa al menos 2 puntos válidos.';
    return;
  }

  // Rango de datos
  const xMin = points[0].x;
  const xMax = points[points.length - 1].x;
  const yMin = 0;
  const yMax = Math.max(...points.map(p => p.y)) * 1.1;

  // Funciones de mapeo a coordenadas canvas
  const toCanvasX = (x) => padding + ((x - xMin) / (xMax - xMin)) * (canvas.width - 2 * padding);
  const toCanvasY = (y) => canvas.height - padding - ((y - yMin) / (yMax - yMin)) * (canvas.height - 2 * padding);

  const dx = (xMax - xMin) / N;
  let totalArea = 0;

  // 1. Dibujar Rectángulos de Riemann
  ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
  ctx.strokeStyle = 'rgba(41, 128, 185, 0.8)';
  ctx.lineWidth = 1;

  for (let i = 0; i < N; i++) {
    const xLeft = xMin + i * dx;
    const xRight = xLeft + dx;
    let xEval;

    if (method === 'left') xEval = xLeft;
    else if (method === 'right') xEval = xRight;
    else if (method === 'midpoint') xEval = xLeft + dx / 2;

    const heightVal = interpolate(xEval, points);
    totalArea += heightVal * dx;

    // Coordenadas en canvas
    const cxLeft = toCanvasX(xLeft);
    const cxRight = toCanvasX(xRight);
    const cyTop = toCanvasY(heightVal);
    const cyBase = toCanvasY(0);

    ctx.fillRect(cxLeft, cyTop, cxRight - cxLeft, cyBase - cyTop);
    ctx.strokeRect(cxLeft, cyTop, cxRight - cxLeft, cyBase - cyTop);
  }

  // 2. Dibujar Área Sombreada Bajo la Curva
  ctx.beginPath();
  ctx.moveTo(toCanvasX(points[0].x), toCanvasY(0));
  for (let p of points) {
    ctx.lineTo(toCanvasX(p.x), toCanvasY(p.y));
  }
  ctx.lineTo(toCanvasX(points[points.length - 1].x), toCanvasY(0));
  ctx.closePath();
  ctx.fillStyle = 'rgba(46, 204, 113, 0.15)';
  ctx.fill();

  // 3. Dibujar Curva Interpolada
  ctx.beginPath();
  ctx.moveTo(toCanvasX(points[0].x), toCanvasY(points[0].y));
  for (let p of points) {
    ctx.lineTo(toCanvasX(p.x), toCanvasY(p.y));
  }
  ctx.strokeStyle = '#27ae60';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 4. Dibujar Puntos Medidos
  ctx.fillStyle = '#e74c3c';
  for (let p of points) {
    ctx.beginPath();
    ctx.arc(toCanvasX(p.x), toCanvasY(p.y), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 5. Dibujar Ejes
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(padding, canvas.height - padding);
  ctx.lineTo(canvas.width - padding, canvas.height - padding);
  ctx.moveTo(padding, padding);
  ctx.lineTo(padding, canvas.height - padding);
  ctx.stroke();

  // Mostrar Resultado
  resultArea.textContent = `Área estimada: ${totalArea.toFixed(4)}`;
}

// Event Listeners
dataInput.addEventListener('input', draw);
methodSelect.addEventListener('change', draw);
rectSlider.addEventListener('input', draw);

// Render inicial
draw();
</script>

</body>
</html>
